server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # React Router owns the client-side routes, so unknown paths must fall back to index.html
    # rather than 404 (otherwise a page refresh on /pipeline/LA-1234 breaks).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # nginx resolves an upstream hostname ONCE at startup and caches the IP forever. When the
        # gateway container restarts it usually gets a new IP on the compose network, and nginx
        # then 502s against the stale address indefinitely.
        #
        # Using Docker's embedded DNS (127.0.0.11) as an explicit resolver, and passing the
        # upstream through a variable, forces re-resolution per request.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_gateway gateway;
        proxy_pass http://$upstream_gateway:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Server-sent events power the live pipeline view. Buffering would hold events back
        # until the response closed, which would defeat the point of streaming progress.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;

        # A full multi-agent run can take several minutes on CPU-bound generation.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
